<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - Secure Password Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="container">

            <a
                class="logo"
                href="{{ url_for('dashboard') }}"
            >
                Secure Password Manager
            </a>

            <div class="nav-links">

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('credentials') }}">
                    Credentials
                </a>

                <form
                    method="POST"
                    action="{{ url_for('logout') }}"
                    style="display: inline;"
                >
                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Logout
                    </button>
                </form>

            </div>

        </div>

    </nav>


    <main class="generator-container">

        <div class="card">

            <h1>Secure Password Generator</h1>

            <p>
                Generate a random 16-character password using the
                application's secure password generator.
            </p>


            <div class="generated-password">
                {{ generated_password }}
            </div>


            <div class="actions">

                <a
                    href="{{ url_for('generate_password') }}"
                    class="btn btn-success"
                >
                    Generate Another Password
                </a>

                <a
                    href="{{ url_for('add_credential') }}"
                    class="btn btn-primary"
                >
                    Add Credential
                </a>

                <a
                    href="{{ url_for('dashboard') }}"
                    class="btn btn-secondary"
                >
                    Back to Dashboard
                </a>

            </div>

        </div>

    </main>


    <footer class="footer">
        Secure Password Manager
    </footer>

</body>
</html>
