<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Secure Password Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">
        <div class="container">
            <a class="logo" href="{{ url_for('login') }}">
                Secure Password Manager
            </a>
        </div>
    </nav>

    <main class="form-container">

        <div class="form-card">

            <h1>Welcome Back</h1>

            <p>
                Login to access your securely stored credentials.
            </p>

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">
                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        maxlength="80"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Login
                </button>

            </form>

            <p>
                Don't have an account?
                <a href="{{ url_for('register') }}">
                    Create Account
                </a>
            </p>

        </div>

    </main>

    <footer class="footer">
        Secure Password Manager
    </footer>

</body>
</html>
