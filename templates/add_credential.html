<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Credential - Secure Password Manager</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <nav class="navbar">

        <div class="container">

            <a
                class="logo"
                href="{{ url_for('dashboard') }}"
            >
                Secure Password Manager
            </a>

            <div class="nav-links">

                <a href="{{ url_for('dashboard') }}">
                    Dashboard
                </a>

                <a href="{{ url_for('credentials') }}">
                    Credentials
                </a>

                <!-- CSRF-protected logout -->
                <form
                    method="POST"
                    action="{{ url_for('logout') }}"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <button
                        type="submit"
                        class="btn btn-danger"
                    >
                        Logout
                    </button>

                </form>

            </div>

        </div>

    </nav>


    <main class="form-container">

        <div class="form-card">

            <h1>Add New Credential</h1>

            <p>
                Enter the website credentials you want to store securely.
            </p>

            <form
                method="POST"
                action="{{ url_for('add_credential') }}"
            >

                <!-- CSRF protection -->
                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <div class="form-group">

                    <label for="website">
                        Website
                    </label>

                    <input
                        type="text"
                        id="website"
                        name="website"
                        placeholder="e.g. example.com"
                        maxlength="255"
                        autocomplete="url"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="website_username">
                        Website Username
                    </label>

                    <input
                        type="text"
                        id="website_username"
                        name="website_username"
                        placeholder="Enter website username"
                        maxlength="120"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Website Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter website password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Credential
                    </button>

                    <a
                        href="{{ url_for('credentials') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </main>


    <footer class="footer">
        Secure Password Manager
    </footer>

</body>
</html>
